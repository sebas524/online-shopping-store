<div class="join flex justify-center items-center my-4">
  @for(page of getPagesArray(); track page){

  <button
    class="join-item btn"
    [class.btn-primary]="page === activePage()"
    [routerLink]="[]"
    [queryParams]="{ page: page }"
    (click)="activePage.set(page)"
  >
    {{ page }}
  </button>

  }@empty {
  <p>no pages to be shown at the moment...</p>
  }
</div>
