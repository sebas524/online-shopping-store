<!-- Image Carousel -->
<div
  class="relative w-full rounded-2xl overflow-hidden shadow-lg bg-base-200"
  #swiperContainer
>
  <!-- Wrapper -->
  <div class="swiper-wrapper">
    @for (image of images(); track $index) {
    <div class="swiper-slide flex items-center justify-center">
      <img
        [src]="image | productImage"
        alt="Product image"
        class="w-full h-[40vh] sm:h-[60vh] lg:h-[70vh] object-cover sm:object-contain transition-transform duration-300 hover:scale-[1.02]"
      />
    </div>
    }
  </div>

  <!-- Pagination -->
  <div class="swiper-pagination bottom-3!"></div>

  <!-- Navigation Buttons -->
  <div
    class="swiper-button-prev text-primary! hover:text-primary-focus! left-3!"
  ></div>
  <div
    class="swiper-button-next text-primary! hover:text-primary-focus! right-3!"
  ></div>

  <!-- Scrollbar (optional) -->
  <div class="swiper-scrollbar"></div>
</div>
