<p>sex-page works!</p>

<h1 class="text-3xl font-semibold my-3">
  Products for
  <span class="text-primary">
    {{ sex() }}
  </span>
</h1>
<h2 class="text-xl font-semibold">enjoy our catalog!</h2>

@if (productsResource.isLoading()) {
<div class="flex justify-center items-center h-40">
  <span class="loading loading-spinner loading-lg"></span>
</div>
} @if (productsResource.error()) {
<p class="text-red-500 text-center mt-4">
  Something went wrong. Please try again later.
</p>
}

<app-pagination
  [pages]="productsResource.value()?.pages ?? 0"
  [currentPage]="paginationService.currentPage()"
></app-pagination>
<div
  class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mt-4"
>
  @for (product of productsResource.value()?.products; track $index) {
  <app-product-card [product]="product"></app-product-card>
  } @empty {
  <p>No products to be shown.</p>
  }
</div>
