<div class="navbar bg-base-100 shadow-sm">
  <div class="navbar-start">
    <div class="dropdown">
      <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h8m-8 6h16"
          />
        </svg>
      </div>
      <ul
        tabindex="-1"
        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
      >
        <li>
          <a
            routerLink="/sex/men"
            class="btn btn-ghost"
            routerLinkActive="text-primary"
            >Men</a
          >
        </li>
        <li>
          <a
            routerLink="/sex/women"
            class="btn btn-ghost"
            routerLinkActive="text-primary"
            >Women</a
          >
        </li>
        <li>
          <a
            routerLink="/sex/kids"
            class="btn btn-ghost"
            routerLinkActive="text-primary"
            >Kids</a
          >
        </li>
        <li>
          <a
            routerLink="/sex/unisex"
            class="btn btn-ghost"
            routerLinkActive="text-primary"
            >Unisex</a
          >
        </li>
      </ul>
    </div>
    <a class="btn btn-ghost text-xl font-light" routerLink="/"
      >The Online <span class="text-accent font-light">Shopping Store</span>
    </a>
  </div>
  <div class="navbar-center hidden lg:flex">
    <ul class="menu menu-horizontal px-1">
      <li>
        <a
          routerLink="/sex/men"
          class="btn btn-ghost"
          routerLinkActive="text-primary"
          >Men</a
        >
      </li>
      <li>
        <a
          routerLink="/sex/women"
          class="btn btn-ghost"
          routerLinkActive="text-primary"
          >Women</a
        >
      </li>
      <li>
        <a
          routerLink="/sex/kids"
          class="btn btn-ghost"
          routerLinkActive="text-primary"
          >Kids</a
        >
      </li>
      <li>
        <a
          routerLink="/sex/unisex"
          class="btn btn-ghost"
          routerLinkActive="text-primary"
          >Unisex</a
        >
      </li>
    </ul>
  </div>
  <div class="navbar-end gap-4">
    @if (authService.authStatus() === "authenticated") {

    <!-- User button -->
    <button class="btn btn-sm btn-info btn-outline">
      {{ authService.user()?.fullName }}
    </button>

    <!-- Logout button -->
    <button class="btn btn-sm btn-primary" (click)="authService.logout()">
      Logout
    </button>

    } @else if (authService.authStatus() === "not-authenticated") {

    <!-- Login button -->
    <a routerLink="/auth/login" class="btn btn-sm btn-primary btn-outline">
      Login
    </a>

    } @else {

    <!-- Loading state -->
    <button class="btn btn-sm btn-ghost loading">Loading</button>

    }
  </div>
</div>
